name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Apply, verify and test overlay (LiteLLM ${{ matrix.litellm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only the current reviewed upstream release is supported.
        litellm: ["1.106.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release tag validator
        run: |
          bash scripts/check-release-tag.sh "v${{ matrix.litellm }}-guard.1"
          ! bash scripts/check-release-tag.sh "v9.9.9-guard.1" 2>/dev/null
          ! bash scripts/check-release-tag.sh "v${{ matrix.litellm }}" 2>/dev/null
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # The final image includes the native UI build and all Provider tests.
      - name: Build and verify overlay
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: LITELLM_VERSION=${{ matrix.litellm }}
          push: false
          load: true
          tags: tali-litellm:ci
          cache-from: type=gha,scope=builder-${{ matrix.litellm }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.litellm }}
      - name: Read pinned Guard release
        id: guard
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          with open("integration/guard-version.json") as stream:
              release = json.load(stream)
          print("revision=" + release["revision"])
          print("version=" + release["version"])
          PYTHON
      - name: Check out Guard v${{ steps.guard.outputs.version }} integration suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tasklattice/tasklattice-guard
          ref: ${{ steps.guard.outputs.revision }}
          path: .guard-integration
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
      - name: Install Guard test runtime
        working-directory: .guard-integration
        run: uv sync --all-extras --frozen
      - name: Real Guard CLI, Controller, Runner and NeMo integration
        env:
          GUARD_CHECKOUT: ${{ github.workspace }}/.guard-integration
          GUARD_TEST_RELAY_IMAGE: tali-litellm:ci
        run: bash scripts/test-guard-integration.sh
